<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Коран — Нур</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #062d29, #17152f);
    min-height: 100vh;
    padding: 20px;
}

.back {
    color: #d4af37;
    text-decoration: none;
    font-size: 20px;
    display: inline-block;
    margin-bottom: 25px;
}

h1 {
    text-align: center;
    color: #d4af37;
}

.info {
    text-align: center;
    color: #cccccc;
    margin-bottom: 20px;
}

.audio-box {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(212,175,55,0.3);
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 25px;
    text-align: center;
}

.audio-box h2 {
    color: #d4af37;
    font-size: 20px;
}

audio {
    width: 100%;
    margin-top: 10px;
}

.ayah {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(212,175,55,0.3);
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 20px;
}

.number {
    color: #d4af37;
    font-weight: bold;
    margin-bottom: 15px;
}

.arabic {
    font-size: 25px;
    line-height: 2;
    text-align: right;
    direction: rtl;
}

.translation {
    margin-top: 15px;
    color: #dddddd;
    line-height: 1.6;
}

.loading {
    text-align: center;
    font-size: 20px;
    margin-top: 50px;
    color: #d4af37;
}
</style>
</head>

<body>

<a href="quran.html" class="back">← К списку сур</a>

<div id="content">
    <div class="loading">📖 Загрузка суры...</div>
</div>

<script>

const id = new URLSearchParams(window.location.search).get("id");

const content = document.getElementById("content");

const audioLinks = {
    "1": "https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/001.mp3",
    "2": "https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/002.mp3",
    "3": "https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/003.mp3"
};

async function loadSurah() {

    if (!id) {
        content.innerHTML = "<h1>Сура не выбрана</h1>";
        return;
    }

    try {

        const response = await fetch(
            "https://api.alquran.cloud/v1/surah/" +
            id +
            "/editions/quran-uthmani,ru.kuliev"
        );

        const result = await response.json();

        if (!result.data) {
            throw new Error("Сура не найдена");
        }

        const arabic = result.data[0];
        const russian = result.data[1];

        let html = `
            <h1>📖 ${arabic.englishName}</h1>

            <div class="info">
                Сура №${arabic.number} · ${arabic.numberOfAyahs} аятов
            </div>
        `;

        if (audioLinks[id]) {
            html += `
                <div class="audio-box">
                    <h2>🔊 Прослушать суру</h2>

                    <audio controls>
                        <source src="${audioLinks[id]}" type="audio/mpeg">
                        Ваш браузер не поддерживает аудио.
                    </audio>
                </div>
            `;
        }

        for (let i = 0; i < arabic.ayahs.length; i++) {

            html += `
                <div class="ayah">

                    <div class="number">
                        Аят ${arabic.ayahs[i].numberInSurah}
                    </div>

                    <div class="arabic">
                        ${arabic.ayahs[i].text}
                    </div>

                    <div class="translation">
                        ${russian.ayahs[i].text}
                    </div>

                </div>
            `;
        }

        content.innerHTML = html;

    } catch (error) {

        content.innerHTML = `
            <h1>😔 Не удалось загрузить суру</h1>

            <div class="info">
                Проверь подключение к интернету и попробуй ещё раз.
            </div>
        `;

    }
}

loadSurah();

</script>

</body>
</html>
