  <title>Коран — Нур</title>

  <style>

    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #062d24, #1b103d);
      padding: 20px;
    }

    .back {
      display: inline-block;
      color: #d4af37;
      text-decoration: none;
      font-size: 18px;
      margin: 10px 0 30px;
    }

    h1 {
      text-align: center;
      color: #d4af37;
      font-size: 36px;
    }

    .search {
      width: 100%;
      padding: 16px;
      margin: 20px 0;
      border: none;
      border-radius: 15px;
      font-size: 16px;
    }

    .sura {
      display: block;
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.1);
      padding: 20px;
      margin: 12px 0;
      border-radius: 20px;
      border: 1px solid rgba(212,175,55,0.35);
    }

    .number {
      color: #d4af37;
      font-weight: bold;
      font-size: 18px;
    }

    .arabic {
      font-size: 22px;
      margin-top: 8px;
      color: #f1e8c8;
    }
  </style>
</head>

    const list = document.getElementById("surahList");

    function showSurahs(items) {

      list.innerHTML = "";

      items.forEach((surah) => {

        const number = surahs.indexOf(surah) + 1;

        list.innerHTML += `
          <a href="surah.html?id=${number}" class="sura">
            <div class="number">${number}. ${surah[0]}</div>
            <div class="arabic">${surah[1]}</div>
          </a>
        `;
      });
    }

    function searchSura() {

      const search = document
        .getElementById("search")
        .value
        .toLowerCase();

      const filtered = surahs.filter((surah) =>
        surah[0].toLowerCase().includes(search)
      );

      showSurahs(filtered);
    }

    showSurahs(surahs);

  </script>
