<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Коран — Нур</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #062d29, #17152f);
}

.back {
    color: #d4af37;
    text-decoration: none;
    font-size: 20px;
}

h1 {
    text-align: center;
    color: #d4af37;
}

.subtitle {
    text-align: center;
    color: #cccccc;
    margin-bottom: 25px;
}

.search {
    width: 100%;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 15px;
    border: 1px solid #d4af37;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 17px;
}

.surah-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(212,175,55,0.3);
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 18px;
}

.surah-link {
    display: flex;
    align-items: center;
    gap: 15px;
    flex: 1;
    color: white;
    text-decoration: none;
}

.number {
    min-width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #d4af37;
    color: #17152f;
    font-weight: bold;
}

.surah-info h2 {
    margin: 0 0 5px;
    color: #d4af37;
}

.surah-info p {
    margin: 0;
    color: #cccccc;
}

.star {
    background: none;
    border: none;
    color: #d4af37;
    font-size: 30px;
}

</style>
</head>

<body>

<a href="index.html" class="back">← На главную</a>

<h1>📖 Коран</h1>
<p class="subtitle">Выберите суру для чтения</p>

<input
    type="text"
    id="search"
    class="search"
    placeholder="🔎 Найти суру..."
    oninput="searchSurah()"
>

<div id="surahList"><div class="surah-card">
    <a href="surah.html?id=1" class="surah-link">
        <div class="number">1</div>
        <div class="surah-info">
            <h2>Аль-Фатиха</h2>
            <p>Открывающая · 7 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('1','Аль-Фатиха')">☆</button>
</div>

<div class="surah-card">
    <a href="surah.html?id=2" class="surah-link">
        <div class="number">2</div>
        <div class="surah-info">
            <h2>Аль-Бакара</h2>
            <p>Корова · 286 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('2','Аль-Бакара')">☆</button>
</div>

<div class="surah-card">
    <a href="surah.html?id=3" class="surah-link">
        <div class="number">3</div>
        <div class="surah-info">
            <h2>Али Имран</h2>
            <p>Семейство Имрана · 200 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('3','Али Имран')">☆</button>
</div>

<div class="surah-card">
    <a href="surah.html?id=4" class="surah-link">
        <div class="number">4</div>
        <div class="surah-info">
            <h2>Ан-Ниса</h2>
            <p>Женщины · 176 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('4','Ан-Ниса')">☆</button>
</div>

<div class="surah-card">
    <a href="surah.html?id=5" class="surah-link">
        <div class="number">5</div>
        <div class="surah-info">
            <h2>Аль-Маида</h2>
            <p>Трапеза · 120 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('5','Аль-Маида')">☆</button>
</div>

<div class="surah-card">
    <a href="surah.html?id=6" class="surah-link">
        <div class="number">6</div>
        <div class="surah-info">
            <h2>Аль-Ан'ам</h2>
            <p>Скот · 165 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('6','Аль-Ан'ам')">☆</button>
</div>

</div><script>

function getFavorites() {
    return JSON.parse(localStorage.getItem("favorites")) || [];
}

function toggleFavorite(id, name) {
    let favorites = getFavorites();

    let exists = favorites.some(function(item) {
        return item.id === id;
    });

    if (exists) {
        favorites = favorites.filter(function(item) {
            return item.id !== id;
        });
    } else {
        favorites.push({
            id: id,
            name: name
        });
    }

    localStorage.setItem("favorites", JSON.stringify(favorites));
    updateStars();
}

function updateStars() {
    let favorites = getFavorites();

    document.querySelectorAll(".star").forEach(function(star) {
        let onclickText = star.getAttribute("onclick");

        let id = onclickText.match(/'(\d+)'/)[1];

        let exists = favorites.some(function(item) {
            return item.id === id;
        });

        star.innerText = exists ? "★" : "☆";
    });
}

function searchSurah() {
    let input = document
        .getElementById("search")
        .value
        .toLowerCase();

    document.querySelectorAll(".surah-card").forEach(function(card) {
        let text = card.innerText.toLowerCase();

        if (text.includes(input)) {
            card.style.display = "flex";
        } else {
            card.style.display = "none";
        }
    });
}

updateStars();

</script>

</body>
</html>
