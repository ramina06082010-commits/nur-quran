<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Коран — Нур</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #062d29, #17152f);
    min-height: 100vh;
    padding: 20px;
}

.back {
    color: #d4af37;
    text-decoration: none;
    font-size: 20px;
    display: inline-block;
    margin-bottom: 25px;
}

h1 {
    text-align: center;
    color: #d4af37;
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #cccccc;
    margin-bottom: 25px;
}

.search {
    width: 100%;
    padding: 15px;
    border-radius: 15px;
    border: 1px solid #d4af37;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 17px;
    margin-bottom: 25px;
}

.favorite-title {
    color: #d4af37;
    margin: 30px 0 15px;
}

.favorite-card {
    display: flex;
    align-items: center;
    gap: 15px;
    background: rgba(255,255,255,0.08);
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 10px;
}

.favorite-card a {
    flex: 1;
    color: white;
    text-decoration: none;
}

.surah-card {
    display: flex;
    align-items: center;
    gap: 15px;
    color: white;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(212,175,55,0.3);
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 18px;
}

.surah-link {
    display: flex;
    align-items: center;
    gap: 15px;
    flex: 1;
    color: white;
    text-decoration: none;
}

.number {
    min-width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #d4af37;
    color: #17152f;
    font-weight: bold;
}

.surah-info {
    flex: 1;
}

.surah-info h2 {
    margin: 0 0 7px;
    font-size: 21px;
    color: #d4af37;
}

.surah-info p {
    margin: 0;
    color: #cccccc;
}

.star {
    background: none;
    border: none;
    color: #d4af37;
    font-size: 30px;
    cursor: pointer;
}

</style>
</head>

<body>

<a href="index.html" class="back">← На главную</a>

<h1>📖 Коран</h1>

<p class="subtitle">Выберите суру для чтения</p>

<input
    type="text"
    id="search"
    class="search"
    placeholder="🔎 Найти суру..."
    onkeyup="searchSurah()"
>

<div id="favorites"></div>

<div id="surahList">

<div class="surah-card" data-id="1" data-name="Аль-Фатиха">
    <a href="surah.html?id=1" class="surah-link">
        <div class="number">1</div>
        <div class="surah-info">
            <h2>Аль-Фатиха</h2>
            <p>Открывающая · 7 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('1', 'Аль-Фатиха')">☆</button>
</div>

<div class="surah-card" data-id="2" data-name="Аль-Бакара">
    <a href="surah.html?id=2" class="surah-link">
        <div class="number">2</div>
        <div class="surah-info">
            <h2>Аль-Бакара</h2>
            <p>Корова · 286 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('2', 'Аль-Бакара')">☆</button>
</div>

<div class="surah-card" data-id="3" data-name="Али Имран">
    <a href="surah.html?id=3" class="surah-link">
        <div class="number">3</div>
        <div class="surah-info">
            <h2>Али Имран</h2>
            <p>Семейство Имрана · 200 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('3', 'Али Имран')">☆</button>
</div>

</div>

<script>

function getFavorites() {
    return JSON.parse(localStorage.getItem("favorites")) || [];
}

function saveFavorites(favorites) {
    localStorage.setItem("favorites", JSON.stringify(favorites));
}

function toggleFavorite(id, name) {
    let favorites = getFavorites();
    let existing = favorites.find(item => item.id === id);

    if (existing) {
        favorites = favorites.filter(item => item.id !== id);
    } else {
        favorites.push({ id, name });
    }

    saveFavorites(favorites);
    updateFavorites();
}

function updateFavorites() {
    const favorites = getFavorites();
    const container = document.getElementById("favorites");

    document.querySelectorAll(".surah-card").forEach(card => {
        const id = card.dataset.id;
        const star = card.querySelector(".star");

        if (favorites.some(item => item.id === id)) {
            star.innerText = "★";
        } else {
            star.innerText = "☆";
        }
    });

    if (favorites.length === 0) {
        container.innerHTML = "";
        return;
    }

    let html = '<h2 class="favorite-title">⭐ Избранное</h2>';

    favorites.forEach(item => {
        html += `
            <div class="favorite-card">
                <a href="surah.html?id=${item.id}">
                    📖 ${item.name}
                </a>
            </div>
        `;
    });

    container.innerHTML = html;
}

function searchSurah() {
    const input = document
        .getElementById("search")
        .value
        .toLowerCase();

    document.querySelectorAll(".surah-card").forEach(card => {
        const text = card.innerText.toLowerCase();

        card.style.display = text.includes(input) ? "flex" : "none";
    });
}

updateFavorites();

</script>

</body>
</html>
