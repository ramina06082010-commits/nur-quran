<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Коран — Нур</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #062d29, #17152f);
}

.back {
    color: #d4af37;
    text-decoration: none;
    font-size: 20px;
    display: inline-block;
    margin-bottom: 25px;
}

h1 {
    text-align: center;
    color: #d4af37;
}

.subtitle {
    text-align: center;
    color: #cccccc;
    margin-bottom: 25px;
}

.search {
    width: 100%;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 15px;
    border: 1px solid #d4af37;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 17px;
}

.surah-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(212,175,55,0.3);
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 18px;
}

.surah-link {
    display: flex;
    align-items: center;
    gap: 15px;
    flex: 1;
    color: white;
    text-decoration: none;
}

.number {
    min-width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #d4af37;
    color: #17152f;
    font-weight: bold;
}

.surah-info h2 {
    margin: 0 0 5px;
    color: #d4af37;
    font-size: 20px;
}

.surah-info p {
    margin: 0;
    color: #cccccc;
}

.star {
    background: none;
    border: none;
    color: #d4af37;
    font-size: 30px;
    cursor: pointer;
}

.favorite-title {
    color: #d4af37;
    margin-top: 30px;
}

.favorite-card {
    background: rgba(255,255,255,0.08);
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 15px;
}

.favorite-card a {
    color: white;
    text-decoration: none;
}

</style>
</head>

<body>

<a href="index.html" class="back">← На главную</a>

<h1>📖 Коран</h1>

<p class="subtitle">Выберите суру для чтения</p>

<input
    type="text"
    id="search"
    class="search"
    placeholder="🔎 Найти суру..."
    oninput="searchSurah()"
>

<div id="favorites"></div>

<div id="surahList">

<div class="surah-card" data-id="1">
    <a href="surah.html?id=1" class="surah-link">
        <div class="number">1</div>
        <div class="surah-info">
            <h2>Аль-Фатиха</h2>
            <p>Открывающая · 7 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('1', 'Аль-Фатиха')">☆</button>
</div>

<div class="surah-card" data-id="2">
    <a href="surah.html?id=2" class="surah-link">
        <div class="number">2</div>
        <div class="surah-info">
            <h2>Аль-Бакара</h2>
            <p>Корова · 286 аятов</p>
        </div>
    </a>
    <button class="star" onclick="toggleFavorite('2', 'Аль-Бакара')">☆</button>
</div>

<div class="surah-card" data-id="3">
    <a href="surah.html?id=3" class="surah-link">
        <div class="number">3</div>
        <div class="surah-info">
            <h2>Али Имран</h2>
