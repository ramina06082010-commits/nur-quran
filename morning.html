<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Утренние азкары — Нур</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #062d29, #17152f);
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
}

.back {
    color: #d4af37;
    text-decoration: none;
    font-size: 20px;
    display: inline-block;
    margin-bottom: 25px;
}

h1 {
    text-align: center;
    color: #d4af37;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #cccccc;
    font-size: 18px;
    margin-bottom: 30px;
}

.azkar {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 20px;
}

.azkar h2 {
    color: #d4af37;
    font-size: 21px;
}

.arabic {
    font-size: 25px;
    text-align: right;
    direction: rtl;
    line-height: 2;
    margin: 20px 0;
}

.translation {
    color: #dddddd;
    font-size: 17px;
    line-height: 1.6;
}

.repeat {
    color: #d4af37;
    margin-top: 15px;
    font-weight: bold;
}
.counter {
    text-align: center;
    margin-top: 20px;
}

.counter p {
    font-size: 28px;
    color: #d4af37;
    font-weight: bold;
}

.counter button {
    border: none;
    padding: 14px 18px;
    margin: 5px;
    border-radius: 15px;
    font-size: 16px;
    cursor: pointer;
}<style>
</head>

<body>

<a href="index.html" class="back">← На главную</a>

<h1>🌅 Утренние азкары</h1>

<p class="subtitle">Начните свой день с поминания Аллаха 🤍</p>


<div class="azkar">

<h2>1. Проснувшись</h2>

<div class="arabic">
الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ
</div>

<div class="translation">
Хвала Аллаху, Который оживил нас после того, как умертвил нас, и к Нему предстоит возвращение.
</div>

</div>


<div class="azkar">

<h2>2. Утреннее поминание</h2>

<div class="arabic">
أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ
</div>

<div class="translation">
Мы встретили утро, и власть принадлежит Аллаху.
</div>

</div>


<div class="azkar">

<h2>3. Просьба о благополучии</h2>

<div class="arabic">
اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ
وَأُشْهِدُ حَمَلَةَ عَرْشِكَ
</div>

<div class="translation">
О Аллах, поистине, этим утром я призываю Тебя в свидетели и призываю ангелов, несущих Твой Трон.
</div>

</div>


<div class="azkar">

<div class="azkar">

<h2>4. Поминание Аллаха</h2>

<div class="arabic">
سُبْحَانَ اللَّهِ وَبِحَمْدِهِ
</div>

<div class="translation">
Пречист Аллах и хвала Ему.
</div>

<div class="repeat">
Рекомендуемое количество: 100 раз
</div>

<div class="counter">
    <p id="count">0 / 100</p>

    <button onclick="addCount()">🤍 Повторить</button>

    <button onclick="resetCount()">↻ Сбросить</button>
</div>

</div>

<div class="arabic">
سُبْحَانَ اللَّهِ وَبِحَمْدِهِ
</div>

<div class="translation">
Пречист Аллах и хвала Ему.
</div>

<div class="repeat">
Повторить: 100 раз
</div>

</div>


<div class="azkar">

<h2>5. Свидетельство веры</h2>

<div class="arabic">
لَا إِلٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ
</div>

<div class="translation">
Нет божества, достойного поклонения, кроме одного Аллаха, у Которого нет сотоварища.
</div>

</div>

<script>

let count = 0;

function addCount() {
    if (count < 100) {
        count++;
        document.getElementById("count").innerText = count + " / 100";
    }
}

function resetCount() {
    count = 0;
    document.getElementById("count").innerText = "0 / 100";
}

</script></body>
</html>
